<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPNCheap Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f1117;color:#c8ccd4;font-size:13px;line-height:1.4}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #1e2230;background:#14161e;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:600;color:#e0e3e8}
.mode{display:inline-flex;border:1px solid #2a2e3c;border-radius:6px;overflow:hidden}
.mode button{padding:4px 10px;background:#1e2230;border:none;color:#7a8190;font-size:12px;cursor:pointer}
.mode button.active{background:#2563eb;color:#fff}
.tunnel{display:flex;align-items:center;gap:6px;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:#22c55e}.dot.off{background:#ef4444}
.btn{padding:5px 10px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#3a3e4c}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:#7f1d1d;color:#f87171}.btn.danger:hover{background:#7f1d1d;color:#fff}
.traffic{display:flex;gap:18px;padding:8px 18px;border-bottom:1px solid #1e2230;font-variant-numeric:tabular-nums;font-size:12px}
.traffic span b{color:#e0e3e8}
.barwrap{width:120px;height:6px;background:#1e2230;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar{height:100%;background:#2563eb;transition:width .3s}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 12px;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:1px solid #1e2230;white-space:nowrap;position:sticky;top:0;background:#14161e;z-index:1}
td{padding:5px 12px;border-bottom:1px solid #1a1d27;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#161821}
.sel{color:#22c55e;font-weight:600}
.lat-good{color:#22c55e}.lat-mid{color:#eab308}.lat-bad{color:#ef4444}
.icon-btn{padding:3px 7px;background:#1e2230;border:1px solid #2a2e3c;border-radius:5px;color:#7a8190;cursor:pointer;font-size:12px}
.icon-btn:hover{color:#c8ccd4;border-color:#3a3e4c}.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.tag{font-size:10px;color:#6b7280}
.conns td{font-size:11px}
.empty{padding:30px;text-align:center;color:#6b7280}
.tabs{display:flex;gap:0;border-bottom:1px solid #1e2230}
.tabs button{padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#7a8190;font-size:12px;cursor:pointer}
.tabs button.active{color:#e0e3e8;border-color:#2563eb}
.err-row{color:#f87171;font-size:11px}
input.search{padding:4px 8px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;width:180px}
</style>
</head>
<body>
<div class="top">
<h1>VPNCheap</h1>
<span class="mode" id="modeCtrl"></span>
<button class="btn" id="testAll" onclick="testAll()">test all</button>
<input class="search" id="search" placeholder="filter nodes" oninput="renderNodes()">
<span class="tunnel">
<span class="dot off" id="tunnelDot"></span><span id="tunnelState" style="font-size:12px;color:#7a8190">…</span>
<button class="btn" id="connBtn" onclick="tunnel('connect')" title="connect tunnel">connect</button>
<button class="btn danger" id="discBtn" onclick="confirmDisc()" title="disconnect tunnel">disconnect</button>
</span>
</div>
<div class="traffic">
<span>up <b id="up">0</b> B/s<span class="barwrap"><span class="bar" id="upBar"></span></span></span>
<span>down <b id="down">0</b> B/s<span class="barwrap"><span class="bar" id="downBar"></span></span></span>
<span style="color:#6b7280">active conns <b id="connCount" style="color:#c8ccd4">0</b></span>
</div>
<div class="tabs">
<button class="active" id="tabNodes" onclick="setTab('nodes')">Nodes</button>
<button id="tabConns" onclick="setTab('conns')">Connections</button>
</div>
<div id="nodesView">
<table><thead><tr>
<th></th><th>Node</th><th>Type</th><th>Delay</th><th></th>
</tr></thead><tbody id="nodeBody"></tbody></table>
</div>
<div id="connsView" style="display:none">
<table class="conns"><thead><tr>
<th>ID</th><th>Network</th><th>Source</th><th>Destination</th><th>Outbound</th><th>Up</th><th>Down</th><th></th>
</tr></thead><tbody id="connBody"></tbody></table>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
let proxies={}, selector='', now='', modes=[], curMode='';
let allNames=[], delayCache={}, testing={};
let maxUp=1, maxDown=1;
let tab='nodes';

async function api(path, opts){
const r=await fetch('/api'+path, opts);
if(!r.ok) throw new Error(r.status+' '+await r.text());
return r.json();
}

function fmtBytes(n){
if(n<1024)return n+' B';
if(n<1048576)return (n/1024).toFixed(1)+' KB';
return (n/1048576).toFixed(1)+' MB';
}
function latC(d){if(!d||d===0)return 'lat-bad';if(d<200)return 'lat-good';if(d<800)return 'lat-mid';return 'lat-bad';}

function renderMode(){
const c=document.getElementById('modeCtrl');
c.innerHTML=modes.map(m=>'<button class="'+(m===curMode?'active':'')+'" onclick="setMode(\''+m+'\')">'+m+'</button>').join('');
}
function renderTunnel(s){
const dot=document.getElementById('tunnelDot');
const st=document.getElementById('tunnelState');
const on=/Connected/i.test(s.state);
dot.className='dot '+(on?'on':'off');
st.textContent=s.state||'Unknown';
}
async function loadConfigs(){
const c=await api('/configs');
modes=c['mode-list']||['Rule','direct','global'];
curMode=c.mode||'Rule';
renderMode();
}
async function setMode(m){
curMode=m;
await api('/configs',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
renderMode();
}
async function loadProxies(){
const d=await api('/proxies');
proxies=d.proxies||{};
for(const[k,v]of Object.entries(proxies)){
if(v.type==='Selector'||v.type==='URLTest'){selector=k;now=v.now||'';allNames=v.all||[];}
}
renderNodes();
}
function renderNodes(){
const q=(document.getElementById('search').value||'').toLowerCase();
const body=document.getElementById('nodeBody');
const names=allNames.filter(n=>n!=='direct'&&n.toLowerCase().includes(q));
if(!names.length){body.innerHTML='<tr><td colspan="5" class="empty">no nodes</td></tr>';return;}
body.innerHTML=names.map(n=>{
const p=proxies[n]||{};
const d=delayCache[n];
const isSel=n===now;
const latTxt=d?(d+'ms'):(testing[n]?'…':'-');
const dc=testing[n]?'':latC(d);
return '<tr>'
+'<td>'+(isSel?'<span class="sel">●</span>':'')+'</td>'
+'<td>'+n+'</td>'
+'<td class="tag">'+(p.type||'-')+'</td>'
+'<td class="'+dc+'">'+latTxt+'</td>'
+'<td><button class="icon-btn" onclick="selectNode(\''+n+'\')" title="select" '+(isSel?'disabled':'')+'>use</button> '
+'<button class="icon-btn" onclick="testOne(\''+n+'\')" title="test delay" '+(testing[n]?'disabled':'')+'>test</button></td>'
+'</tr>';
}).join('');
if(window.lucide)lucide.createIcons();
}
async function selectNode(n){
await api('/proxies/'+encodeURIComponent(selector),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
now=n;renderNodes();
}
async function testOne(n){
testing[n]=true;renderNodes();
try{
const r=await api('/proxies/'+encodeURIComponent(n)+'/delay?timeout=5000&url=http://www.gstatic.com/generate_204');
delayCache[n]=r.delay||0;
}catch(e){delayCache[n]=0;}
finally{testing[n]=false;renderNodes();}
}
async function testAll(){
const names=allNames.filter(n=>n!=='direct');
const CONC=8;let i=0;
const run=async()=>{while(i<names.length){const n=names[i++];await testOne(n);}};
await Promise.all(Array.from({length:CONC},run));
}
function setTab(t){
tab=t;
document.getElementById('tabNodes').className=t==='nodes'?'active':'';
document.getElementById('tabConns').className=t==='conns'?'active':'';
document.getElementById('nodesView').style.display=t==='nodes'?'':'none';
document.getElementById('connsView').style.display=t==='conns'?'':'none';
}
function renderConns(d){
const body=document.getElementById('connBody');
const list=(d&&d.connections)||[];
document.getElementById('connCount').textContent=list.length;
if(!list.length){body.innerHTML='<tr><td colspan="8" class="empty">no active connections</td></tr>';return;}
body.innerHTML=list.map(c=>{
const s=c.metadata||{};
return '<tr>'
+'<td class="tag">'+(c.id||'').slice(0,8)+'</td>'
+'<td>'+(c.metadata.network||'-')+'</td>'
+'<td>'+(s.sourceIP||s.sourceHost||'-')+':'+(s.sourcePort||'')+'</td>'
+'<td>'+(s.destinationIP||s.host||s.destinationPort||'-')+'</td>'
+'<td>'+(c.chains||[]).join('>')+'</td>'
+'<td>'+fmtBytes(c.upload||0)+'</td>'
+'<td>'+fmtBytes(c.download||0)+'</td>'
+'<td><button class="icon-btn" onclick="closeConn(\''+c.id+'\')" title="close">close</button></td>'
+'</tr>';
}).join('');
}
async function closeConn(id){
await api('/connections/'+encodeURIComponent(id),{method:'DELETE'});
pollConns();
}
async function pollConns(){
try{renderConns(await api('/connections'));}catch(e){}
}
function startTraffic(){
fetch('/api/traffic').then(r=>{
const rd=r.body.getReader();let buf='';
const pump=()=>rd.read().then(({done,value})=>{
if(done)return;
buf+=new TextDecoder().decode(value);
let i;
while((i=buf.indexOf('\n'))>=0){
const line=buf.slice(0,i);buf=buf.slice(i+1);
try{const d=JSON.parse(line);
const up=d.up||0,down=d.down||0;
maxUp=Math.max(maxUp,up);maxDown=Math.max(maxDown,down);
document.getElementById('up').textContent=fmtBytes(up);
document.getElementById('down').textContent=fmtBytes(down);
document.getElementById('upBar').style.width=(up/maxUp*100)+'%';
document.getElementById('downBar').style.width=(down/maxDown*100)+'%';
}catch(e){}
}
return pump();
});
return pump();
}).catch(()=>{});
}
async function pollTunnel(){
try{const r=await fetch('/tunnel?action=status');renderTunnel(await r.json());}catch(e){}
}
async function tunnel(action){
await fetch('/tunnel?action='+action,{method:'POST'});
setTimeout(pollTunnel,1500);
}
function confirmDisc(){
if(confirm('Disconnect the VPNCheap tunnel?'))tunnel('disconnect');
}
async function poll(){
try{await Promise.all([loadConfigs(),loadProxies()]);}catch(e){}
}
poll();pollConns();pollTunnel();startTraffic();
setInterval(poll,5000);setInterval(pollConns,3000);setInterval(pollTunnel,5000);
</script>
</body>
</html>
