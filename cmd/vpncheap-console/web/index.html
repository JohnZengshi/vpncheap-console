<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPNCheap Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f1117;color:#c8ccd4;font-size:13px;line-height:1.4}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #1e2230;background:#14161e;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:600;color:#e0e3e8}
.mode{display:inline-flex;border:1px solid #2a2e3c;border-radius:6px;overflow:hidden}
.mode button{padding:4px 10px;background:#1e2230;border:none;color:#7a8190;font-size:12px;cursor:pointer}
.mode button.active{background:#2563eb;color:#fff}
.tunnel{display:flex;align-items:center;gap:6px;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:#22c55e}.dot.off{background:#ef4444}
.btn{padding:5px 10px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#3a3e4c}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:#7f1d1d;color:#f87171}.btn.danger:hover{background:#7f1d1d;color:#fff}
.traffic{display:flex;gap:18px;padding:8px 18px;border-bottom:1px solid #1e2230;font-variant-numeric:tabular-nums;font-size:12px}
.traffic span b{color:#e0e3e8}
.barwrap{width:120px;height:6px;background:#1e2230;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar{height:100%;background:#2563eb;transition:width .3s}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 12px;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:1px solid #1e2230;white-space:nowrap;position:sticky;top:0;background:#14161e;z-index:1}
td{padding:5px 12px;border-bottom:1px solid #1a1d27;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#161821}
.sel{color:#22c55e;font-weight:600}
.lat-good{color:#22c55e}.lat-mid{color:#eab308}.lat-bad{color:#ef4444}
.icon-btn{padding:3px 7px;background:#1e2230;border:1px solid #2a2e3c;border-radius:5px;color:#7a8190;cursor:pointer;font-size:12px}
.icon-btn:hover{color:#c8ccd4;border-color:#3a3e4c}.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.tag{font-size:10px;color:#6b7280}
.conns td{font-size:11px}
.empty{padding:30px;text-align:center;color:#6b7280}
.tabs{display:flex;gap:0;border-bottom:1px solid #1e2230}
.tabs button{padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#7a8190;font-size:12px;cursor:pointer}
.tabs button.active{color:#e0e3e8;border-color:#2563eb}
.err-row{color:#f87171;font-size:11px}
input.search{padding:4px 8px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;width:180px}
.node-id{font-size:10px;color:#6b7280;margin-top:1px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.health-bar{padding:4px 18px;font-size:12px;border-bottom:1px solid #1e2230;display:none;align-items:center;gap:8px}
.health-bar.show{display:flex}
.health-bar .ph{width:8px;height:8px;border-radius:50%}
.health-bar.launching .ph{background:#eab308}
.health-bar.ready .ph{display:none}
.health-bar.degraded .ph{background:#ef4444}
td b{font-weight:600}
</style>
</head>
<body>
<div class="top">
<h1>VPNCheap</h1>
<span class="mode" id="modeCtrl"></span>
<button class="btn" id="testAll" onclick="testAll()">test all</button>
<button class="btn" id="bestBtn" onclick="pickBest()">best</button>
<button class="btn" id="exitBtn" onclick="checkExit()">exit ip</button>
<input class="search" id="search" placeholder="filter nodes" oninput="renderNodes()">
<span class="tunnel">
<span class="dot off" id="tunnelDot"></span><span id="tunnelState" style="font-size:12px;color:#7a8190">…</span>
<button class="btn" id="connBtn" onclick="tunnel('connect')" title="connect tunnel">connect</button>
<button class="btn danger" id="discBtn" onclick="confirmDisc()" title="disconnect tunnel">disconnect</button>
</span>
</div>
<div class="health-bar" id="healthBar"><span class="ph"></span><span id="healthText"></span></div>
<div class="traffic">
<span>up <b id="up">0</b> B/s<span class="barwrap"><span class="bar" id="upBar"></span></span></span>
<span>down <b id="down">0</b> B/s<span class="barwrap"><span class="bar" id="downBar"></span></span></span>
<span style="color:#6b7280">active conns <b id="connCount" style="color:#c8ccd4">0</b></span>
<span style="margin-left:auto" id="exitInfo"></span>
</div>
<div class="tabs">
<button class="active" id="tabNodes" onclick="setTab('nodes')">Nodes</button>
<button id="tabConns" onclick="setTab('conns')">Connections</button>
<button id="tabProxy" disabled title="Proxy disabled">Proxy</button>
</div>
<div id="nodesView">
<table><thead><tr>
<th></th><th>Node</th><th>Type</th><th>Delay</th><th></th>
</tr></thead><tbody id="nodeBody"></tbody></table>
</div>
<div id="connsView" style="display:none">
<table class="conns"><thead><tr>
<th>ID</th><th>Network</th><th>Source</th><th>Destination</th><th>Outbound</th><th>Up</th><th>Down</th><th></th>
</tr></thead><tbody id="connBody"></tbody></table>
</div>
<div id="proxyView" style="display:none;padding:12px 18px">
<div style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
<span class="dot off" id="proxyDot"></span>
<span style="font-size:12px;color:#7a8190" id="proxyStatus">loading…</span>
</div>
<div style="margin-bottom:14px">
<label style="font-size:11px;color:#6b7280;text-transform:uppercase;display:block;margin-bottom:4px">Fallback node</label>
<select id="proxyFallback" style="padding:4px 8px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;min-width:200px"></select>
</div>
<div style="margin-bottom:14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
<label style="font-size:11px;color:#6b7280;text-transform:uppercase">Domain routing rules</label>
<button class="btn" onclick="addRuleRow()" style="font-size:11px;padding:3px 8px">+ add rule</button>
<button class="btn" onclick="saveRules()" style="font-size:11px;padding:3px 8px">save</button>
<button class="btn" onclick="exportRules()" style="font-size:11px;padding:3px 8px" title="export for 9router">export</button>
</div>
<table id="proxyRulesTable" style="width:100%"><thead><tr>
<th style="width:50%">Domain (suffix match)</th><th style="width:40%">Node</th><th style="width:10%"></th>
</tr></thead><tbody id="proxyRulesBody"></tbody></table>
<div id="proxySaveMsg" style="font-size:11px;margin-top:6px;display:none"></div>
</div>
<div style="margin-bottom:14px;border-top:1px solid #1e2230;padding-top:14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
<label style="font-size:11px;color:#6b7280;text-transform:uppercase">Multi-port (9router)</label>
<button class="btn" onclick="loadMultiport()" style="font-size:11px;padding:3px 8px">refresh</button>
<button class="btn" onclick="exportMultiport()" style="font-size:11px;padding:3px 8px">export 9router</button>
</div>
<div id="multiportStatus" style="font-size:12px;color:#7a8190;margin-bottom:8px">click refresh to load</div>
<table id="multiportTable" style="width:100%;display:none"><thead><tr>
<th style="width:50%">Node</th><th style="width:50%">Proxy URL</th>
</tr></thead><tbody id="multiportBody"></tbody></table>
</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
let proxies={}, selector='', now='', modes=[], curMode='';
let allNames=[], delayCache={}, testing={}, switching={}, labelMap={};
let maxUp=1, maxDown=1;
let tab='nodes';

async function api(path, opts){
const r=await fetch('/api'+path, opts);
if(!r.ok) throw new Error(r.status+' '+await r.text());
// The Clash API returns 204 No Content for PUT/DELETE (empty body, .json()
// would reject). Only skip parsing for those — don't check content-type,
// because sing-box sends "text/plain" even for JSON bodies.
if(r.status===204) return null;
return r.json();
}

function fmtBytes(n){
if(n<1024)return n+' B';
if(n<1048576)return (n/1024).toFixed(1)+' KB';
return (n/1048576).toFixed(1)+' MB';
}
function latC(d){if(!d||d===0)return 'lat-bad';if(d<200)return 'lat-good';if(d<800)return 'lat-mid';return 'lat-bad';}

function renderMode(){
const c=document.getElementById('modeCtrl');
c.innerHTML=modes.map(m=>'<button class="'+(m===curMode?'active':'')+'" onclick="setMode(\''+m+'\')">'+m+'</button>').join('');
}
function renderTunnel(s){
const dot=document.getElementById('tunnelDot');
const st=document.getElementById('tunnelState');
const on=/Connected/i.test(s.state);
dot.className='dot '+(on?'on':'off');
st.textContent=s.state||'Unknown';
}
async function loadConfigs(){
const c=await api('/configs');
modes=c['mode-list']||['Rule','direct','global'];
curMode=c.mode||'Rule';
renderMode();
}
async function setMode(m){
curMode=m;
await api('/configs',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
renderMode();
}
async function loadProxies(){
const d=await api('/proxies');
proxies=d.proxies||{};
for(const[k,v]of Object.entries(proxies)){
if(v.type==='Selector'||v.type==='URLTest'){selector=k;now=v.now||'';allNames=v.all||[];}
}
renderNodes();
fetchLabels();
}
async function fetchLabels(){
try{
const r=await fetch('/labels');
const d=await r.json();
labelMap=d.mapping||{};
}catch(e){}
renderNodes();
}
function displayLabel(n){return labelMap[n]||n;}
function renderNodes(){
const q=(document.getElementById('search').value||'').toLowerCase();
const body=document.getElementById('nodeBody');
const names=allNames.filter(n=>n!=='direct'&&(n.toLowerCase().includes(q)||(labelMap[n]||'').toLowerCase().includes(q)));
if(!names.length){body.innerHTML='<tr><td colspan="5" class="empty">no nodes</td></tr>';return;}
body.innerHTML=names.map(n=>{
const p=proxies[n]||{};
const d=delayCache[n];
const isSel=n===now;
const busy=testing[n]||switching[n];
const latTxt=d?(d+'ms'):(busy?'…':'-');
const dc=busy?'':latC(d);
return '<tr>'
+'<td>'+(isSel?'<span class="sel">●</span>':'')+(switching[n]?'<span class="sel" style="color:#eab308">↻</span>':'')+'</td>'
+'<td title="'+n+'"><b>'+displayLabel(n)+'</b><div class="node-id">'+n+'</div></td>'
+'<td class="tag">'+(p.type||'-')+'</td>'
+'<td class="'+dc+'">'+latTxt+'</td>'
+'<td><button class="icon-btn" onclick="selectNode(\''+n+'\')" title="select" '+(isSel||busy?'disabled':'')+'>use</button> '
+'<button class="icon-btn" onclick="testOne(\''+n+'\')" title="test delay" '+(busy?'disabled':'')+'>test</button></td>'
+'</tr>';
}).join('');
if(window.lucide)lucide.createIcons();
}
async function selectNode(n){
// Loading: show spinner + disable controls until the switch is live. The
// selector PUT only routes *new* connections; clearing live connections makes
// the switch take effect immediately without bouncing the VPN tunnel.
switching[n]=true;renderNodes();
try{
await api('/proxies/'+encodeURIComponent(selector),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
now=n;renderNodes();
await api('/connections',{method:'DELETE'});
}catch(e){ /* best-effort: the selector may still have switched */ }
finally{switching[n]=false;renderNodes();}
}
async function testOne(n){
testing[n]=true;renderNodes();
try{
const r=await api('/proxies/'+encodeURIComponent(n)+'/delay?timeout=5000&url=http://www.gstatic.com/generate_204');
delayCache[n]=r.delay||0;
}catch(e){delayCache[n]=0;}
finally{testing[n]=false;renderNodes();}
}
async function testAll(){
const names=allNames.filter(n=>n!=='direct');
const CONC=8;let i=0;
const run=async()=>{while(i<names.length){const n=names[i++];await testOne(n);}};
await Promise.all(Array.from({length:CONC},run));
}
async function pickBest(){
const btn=document.getElementById('bestBtn');
btn.disabled=true;btn.textContent='testing...';
try{
const r=await fetch('/best',{method:'POST'});
const d=await r.json();
for(const res of d.results||[])delayCache[res.name]=res.delay||0;
if(d.best)now=d.best.name;
renderNodes();
btn.textContent=d.best?'best: '+displayLabel(d.best.name)+' ('+d.best.delay+'ms)':'best: all failed';
}catch(e){btn.textContent='best: error';}
finally{btn.disabled=false;setTimeout(()=>{btn.textContent='best';},3000);}
}
async function checkExit(){
const btn=document.getElementById('exitBtn');
const out=document.getElementById('exitInfo');
btn.disabled=true;btn.textContent='checking...';
try{
const r=await fetch('/exit');
const d=await r.json();
if(d.error){out.textContent='exit: '+d.error;}
else{
out.textContent='exit: '+d.ip+' · '+(d.city||'')+(d.country?' ('+d.country+')':'')+(d.org?' ['+d.org+']':'')+' tunnel:'+(d.tunnel?d.tunnel.state:'?');
}
}catch(e){out.textContent='exit: error';}
finally{btn.disabled=false;btn.textContent='exit ip';}
}
function setTab(t){
if(t==='proxy')return;
tab=t;
document.getElementById('tabNodes').className=t==='nodes'?'active':'';
document.getElementById('tabConns').className=t==='conns'?'active':'';
document.getElementById('tabProxy').className=t==='proxy'?'active':'';
document.getElementById('nodesView').style.display=t==='nodes'?'':'none';
document.getElementById('connsView').style.display=t==='conns'?'':'none';
document.getElementById('proxyView').style.display=t==='proxy'?'':'none';
}
function renderConns(d){
const body=document.getElementById('connBody');
const list=(d&&d.connections)||[];
document.getElementById('connCount').textContent=list.length;
if(!list.length){body.innerHTML='<tr><td colspan="8" class="empty">no active connections</td></tr>';return;}
body.innerHTML=list.map(c=>{
const s=c.metadata||{};
return '<tr>'
+'<td class="tag">'+(c.id||'').slice(0,8)+'</td>'
+'<td>'+(c.metadata.network||'-')+'</td>'
+'<td>'+(s.sourceIP||s.sourceHost||'-')+':'+(s.sourcePort||'')+'</td>'
+'<td>'+(s.destinationIP||s.host||s.destinationPort||'-')+'</td>'
+'<td>'+(c.chains||[]).join('>')+'</td>'
+'<td>'+fmtBytes(c.upload||0)+'</td>'
+'<td>'+fmtBytes(c.download||0)+'</td>'
+'<td><button class="icon-btn" onclick="closeConn(\''+c.id+'\')" title="close">close</button></td>'
+'</tr>';
}).join('');
}
async function closeConn(id){
await api('/connections/'+encodeURIComponent(id),{method:'DELETE'});
pollConns();
}
async function pollConns(){
try{renderConns(await api('/connections'));}catch(e){}
}
function startTraffic(){
fetch('/api/traffic').then(r=>{
const rd=r.body.getReader();let buf='';
const pump=()=>rd.read().then(({done,value})=>{
if(done)return;
buf+=new TextDecoder().decode(value);
let i;
while((i=buf.indexOf('\n'))>=0){
const line=buf.slice(0,i);buf=buf.slice(i+1);
try{const d=JSON.parse(line);
const up=d.up||0,down=d.down||0;
maxUp=Math.max(maxUp,up);maxDown=Math.max(maxDown,down);
document.getElementById('up').textContent=fmtBytes(up);
document.getElementById('down').textContent=fmtBytes(down);
document.getElementById('upBar').style.width=(up/maxUp*100)+'%';
document.getElementById('downBar').style.width=(down/maxDown*100)+'%';
}catch(e){}
}
return pump();
});
return pump();
}).catch(()=>{});
}
async function pollHealth(){
try{
const r=await fetch('/health');const d=await r.json();const b=document.getElementById('healthBar');
b.className='health-bar show '+d.phase;
document.getElementById('healthText').textContent=d.phase+': '+d.detail;
if(d.phase==='ready')b.className='health-bar ready';
}catch(e){}
}
async function pollTunnel(){
try{const r=await fetch('/tunnel?action=status');renderTunnel(await r.json());}catch(e){}
}
async function tunnel(action){
await fetch('/tunnel?action='+action,{method:'POST'});
setTimeout(pollTunnel,1500);
}
function confirmDisc(){
if(confirm('Disconnect the VPNCheap tunnel?'))tunnel('disconnect');
}
async function poll(){
try{await Promise.all([loadConfigs(),loadProxies()]);}catch(e){}
}
loadProxy();
// ---- Proxy router UI ----
async function proxyApi(path, opts){
  const r=await fetch(path, opts);
  if(!r.ok) throw new Error(r.status+' '+await r.text());
  if(r.status===204) return null;
  return r.json();
}
async function loadProxy(){
  try{
    const [status, rules]=await Promise.all([
      proxyApi('/proxy/status'),
      proxyApi('/proxy/rules')
    ]);
    // status
    const dot=document.getElementById('proxyDot');
    dot.className=status.running?'dot on':'dot off';
    document.getElementById('proxyStatus').textContent=
      status.running?('running on '+status.addr):'not running';
    // rules table
    renderProxyRules(rules, allNames);
  }catch(e){
    document.getElementById('proxyStatus').textContent='proxy not available';
    document.getElementById('proxyDot').className='dot off';
  }
}
function renderProxyRules(rules, nodes){
  const body=document.getElementById('proxyRulesBody');
  // populate fallback dropdown
  const sel=document.getElementById('proxyFallback');
  sel.innerHTML='<option value="">(none)</option>'+
    nodes.map(n=>'<option value="'+n+'"'+(n===rules.fallback?' selected':'')+'>'+displayLabel(n)+'</option>').join('');
  // rules rows
  const r=rules.rules||[];
  if(!r.length){
    body.innerHTML='<tr><td colspan="3" class="empty">no rules — all traffic uses fallback</td></tr>';
    return;
  }
  body.innerHTML=r.map((rule,i)=>{
    return '<tr>'
      +'<td><input class="search" style="width:100%" value="'+(rule.domain||'')+'" data-ridx="'+i+'" data-field="domain" placeholder="example.com"></td>'
      +'<td><select style="padding:4px 8px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;width:100%" data-ridx="'+i+'" data-field="node">'
      +'<option value="">(select)</option>'
      +nodes.map(n=>'<option value="'+n+'"'+(n===rule.node?' selected':'')+'>'+displayLabel(n)+'</option>').join('')
      +'</select></td>'
      +'<td><button class="icon-btn" onclick="delRuleRow('+i+')" title="delete">✕</button></td>'
      +'</tr>';
  }).join('');
}
function addRuleRow(){
  const body=document.getElementById('proxyRulesBody');
  if(body.querySelector('.empty'))body.innerHTML='';
  const i=body.children.length;
  const nodes=allNames;
  body.insertAdjacentHTML('beforeend',
    '<tr>'
    +'<td><input class="search" style="width:100%" value="" data-ridx="'+i+'" data-field="domain" placeholder="example.com"></td>'
    +'<td><select style="padding:4px 8px;background:#1e2230;border:1px solid #2a2e3c;border-radius:6px;color:#c8ccd4;font-size:12px;width:100%" data-ridx="'+i+'" data-field="node">'
    +'<option value="">(select)</option>'
    +nodes.map(n=>'<option value="'+n+'">'+displayLabel(n)+'</option>').join('')
    +'</select></td>'
    +'<td><button class="icon-btn" onclick="delRuleRow('+i+')" title="delete">✕</button></td>'
    +'</tr>'
  );
}
function delRuleRow(i){
  const body=document.getElementById('proxyRulesBody');
  const row=body.querySelector('tr:nth-child('+(i+1)+')');
  if(row)row.remove();
  // reindex
  Array.from(body.querySelectorAll('tr')).forEach((tr,idx)=>{
    tr.querySelectorAll('[data-ridx]').forEach(el=>el.dataset.ridx=idx);
    const btn=tr.querySelector('button[onclick^="delRuleRow"]');
    if(btn)btn.setAttribute('onclick','delRuleRow('+idx+')');
  });
}
async function exportRules(){
  window.open('/proxy/export?target=9router','_blank');
}
async function saveRules(){
  const body=document.getElementById('proxyRulesBody');
  const rows=Array.from(body.querySelectorAll('tr')).map(tr=>{
    const domain=tr.querySelector('[data-field="domain"]')?.value||'';
    const node=tr.querySelector('[data-field="node"]')?.value||'';
    return {domain,node};
  }).filter(r=>r.domain&&r.node);
  const fallback=document.getElementById('proxyFallback').value;
  const msg=document.getElementById('proxySaveMsg');
  msg.style.display='block';
  msg.textContent='saving…';
  msg.style.color='#eab308';
  try{
    await proxyApi('/proxy/rules',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fallback,rules:rows})
    });
    msg.textContent='saved ✓';
    msg.style.color='#22c55e';
    setTimeout(()=>msg.style.display='none',3000);
  }catch(e){
    msg.textContent='error: '+e.message;
    msg.style.color='#ef4444';
  }
}

// ---- Multi-port (9router) ----
async function loadMultiport(){
  try{
    const d=await (await fetch('/multiport/status')).json();
    const st=document.getElementById('multiportStatus');
    if(d.running){
      st.textContent=d.ports+' ports active, last node: '+(d.last_node||'none');
      const body=document.getElementById('multiportBody');
      const list=d.list||[];
      body.innerHTML=list.map(p=>'<tr><td>'+displayLabel(p.tag)+'</td><td><code style="font-size:11px;color:#7a8190">http://127.0.0.1:'+p.port+'</code></td></tr>').join('');
      document.getElementById('multiportTable').style.display='';
    } else {
      st.textContent='multi-port not running (start with -multiport flag)';
      document.getElementById('multiportTable').style.display='none';
    }
  }catch(e){
    document.getElementById('multiportStatus').textContent='multi-port not available';
    document.getElementById('multiportTable').style.display='none';
  }
}
function exportMultiport(){
  window.open('/multiport/export','_blank');
}
loadProxy();pollHealth();poll();pollConns();pollTunnel();startTraffic();
